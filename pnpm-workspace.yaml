packages:
  - packages/*
  - apps/*

# 允许执行安装脚本的依赖（esbuild 二进制；其余一律禁跑）
allowBuilds:
  esbuild: true

# 共享依赖版本单一来源（architecture.md §6：版本由 catalog 统一管理）
catalog:
  # react
  react: 19.3.1
  react-dom: 19.3.1
  "@types/react": 19.3.0
  "@types/react-dom": 19.3.0
  "@types/node": 22.20.5

  # tanstack
  "@tanstack/react-query": 5.104.5
  "@tanstack/react-router": 1.170.45
  "@tanstack/react-table": 9.3.1
  "@tanstack/router-plugin": 1.168.47
  "@tanstack/router-cli": 1.167.45

  # 其它运行时
  zod: 4.6.7
  next-themes: 0.4.6
  lucide-react: 1.61.0
  clsx: 2.1.1
  tailwind-merge: 3.7.0
  class-variance-authority: 0.7.1
  cn: 0.5.0
  cmdk: 1.1.1
  "@base-ui/react": 1.9.0
  shadcn: 4.22.1
  sonner: 2.0.8
  tw-animate-css: 1.4.0

  # 构建 / 工具链
  typescript: 5.9.3
  vite: 8.3.5
  "@vitejs/plugin-react": 6.1.2
  tailwindcss: 4.3.3
  "@tailwindcss/vite": 4.3.3
  vitest: 5.0.5
  "@testing-library/react": 16.3.3
  happy-dom: 21.0.4
  tsup: 9.0.0
  tsx: 4.23.15
  "@biomejs/biome": 2.6.2

minimumReleaseAgeExclude:
  - "@biomejs/biome@2.6.2"
  - "@biomejs/cli-android-arm64@2.6.2"
  - "@biomejs/cli-android-x64@2.6.2"
  - "@biomejs/cli-darwin-arm64@2.6.2"
  - "@biomejs/cli-darwin-x64@2.6.2"
  - "@biomejs/cli-linux-arm64-musl@2.6.2"
  - "@biomejs/cli-linux-arm64@2.6.2"
  - "@biomejs/cli-linux-x64-musl@2.6.2"
  - "@biomejs/cli-linux-x64@2.6.2"
  - "@biomejs/cli-win32-arm64@2.6.2"
  - "@biomejs/cli-win32-x64@2.6.2"
  - lucide-react@1.61.0
  - vite@8.3.5
  - happy-dom@21.0.4
