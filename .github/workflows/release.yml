name: Release

# ADR-0011：npm publish 已启用（取代 ADR-0007 暂缓条款）。
# 模式：push main 且有 changeset → changesets/action 开/更新 "Version Packages" PR；
# 该 PR 合并（changeset 清空、版本落定）→ publish 脚本（release-publish）：
# changeset tag 推 tag + CHANGELOG，changeset publish 发 npm（NPM_TOKEN secret 门控，未配置保持 tag-only）。

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Changesets (tag + changelog + npm)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # 推送 tag 与版本提交
      pull-requests: write # 开/更新 Version Packages PR
    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }} # 未配置时 npm-publish.mjs 静默跳过，保持 tag-only
    steps:
      - uses: actions/checkout@v4

      # pnpm 版本读根 package.json 的 packageManager 字段
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # npm publish 认证：仅在仓库 secret NPM_TOKEN 已配置时写入 ~/.npmrc（changesets publish 读用户级配置）
      - name: Setup npm auth
        if: env.NPM_TOKEN != ''
        run: echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > ~/.npmrc

      # version = 有 changeset 时更新 Version Packages PR；publish = 版本提交进 main 后执行
      #（changeset tag 推 tag + npm publish；后者由 NPM_TOKEN 门控，见 scripts/npm-publish.mjs）。
      # action 不经 shell，publish 里写 && 会被当成 changeset 的参数，故复合逻辑都在 npm 脚本内。
      - uses: changesets/action@v1
        with:
          version: pnpm version-packages
          publish: pnpm release-publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
