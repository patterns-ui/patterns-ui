name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: lint / build / typecheck / test / registry validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # pnpm 版本读根 package.json 的 packageManager 字段
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint (biome)
        run: pnpm lint

      # 先构建：demo 的 typecheck 依赖 core dist 的 d.ts；registry:build 产出 registry.json 供 validate
      - name: Build (core + registry)
        run: pnpm build

      # 产物新鲜度：registry 构建输出 + 词表生成物 + agent 文档生成物必须与提交进仓库的版本一致
      # （改源不改产物 = 红）。docs:generate 产出 AGENTS.md / CLAUDE.md symlink / docs/patterns.md
      # （M7-C1）；词表在前、文档在后（文档词表节 import blocks.generated.ts）。
      # 与 scripts/ui-check.mjs 第 5 步 freshness 同口径——两处同步改。
      - name: Freshness (registry.json / dist / theme css / vocab / agent docs)
        run: |
          pnpm vocab:generate
          pnpm docs:generate
          git diff --exit-code -- registry.json registry/dist/r 'registry/themes/*.css' 'packages/core/src/vocab/blocks.generated.ts' AGENTS.md docs/patterns.md CLAUDE.md
          # skills 三目录单一源同步校验（M7-C3）：.zcode/skills 为源，另两目录为副本，逐字节一致
          diff -r .zcode/skills .claude/skills
          diff -r .zcode/skills .agents/skills

      - name: Typecheck (all workspaces)
        run: pnpm -r typecheck

      - name: Unit & guard tests (core + demo)
        run: pnpm -r test

      # M7-B1：范式 lint（pages/registry 域四规则）+ archetype/slot 三方一致 + freeze 清单
      - name: Paradigm lint (eslint-plugin)
        run: pnpm lint:eslint
      - name: Archetype/slot consistency check
        run: pnpm slots:check

      # M7-B3：一致性分数棘轮（只许升）
      - name: Consistency score (--check)
        run: pnpm ui:score --check

      # shadcn CLI 直拉法：CI 网络可直连 schema（本机 init/add 挂起是网络环境问题）
      - name: Validate shadcn registry
        run: pnpm dlx shadcn@latest registry validate

      - name: Build demo (vite)
        run: pnpm --filter demo build

  # ADR-0007：暂不 npm publish，但 publint/attw 保证 @patterns-ui/core 随时可发
  publint-attw:
    name: publint / attw (@patterns-ui/core)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # pnpm 版本读根 package.json 的 packageManager 字段
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build core (dual esm+cjs)
        run: pnpm --filter @patterns-ui/core build

      - name: publint
        run: pnpm --filter @patterns-ui/core exec publint

      # attw：npm 上的 "attw" 是防依赖混淆占位包，真身是 @arethetypeswrong/cli。
      # --profile node16 = 检查 node16 的 CJS 与 ESM 双向解析（bundler 免检）。
      # 排除 node10 列：该解析模式不认 exports map，子路径物理上无解（Node 10 亦不识别 .cjs，
      # 垫目录也救不了 require）——CJS 支持已诚实落地（双格式 + .d.cts 条件），非掩盖。
      - name: attw (pack & analyze)
        run: pnpm dlx @arethetypeswrong/cli -P packages/core --profile node16

  # 消费端冒烟：tmp vite+react19+ts 工程里 shadcn add 我们的 theme + status-badge → vite build → headless 令牌断言。
  # M7-C2 起 smoke 内含 pattern item 的 `shadcn add --dry-run` 冒烟（audit-log 组装入口经 overlay
  # server 解析整棵依赖树；剥离坑与 overlay 语义见 scripts/registry-consumer-smoke.mjs 头注与 registry.md §2）。
  # M7-D 起再含两段：skills 通道一 item 真实 add（~ target staging 落盘 + 内嵌渲染脚本三宿主渲染断言，
  # registry.md §4）与消费端 typecheck 防线（core pack → file: 装包 → 词表外名字 tsc 报错列全表 → 复绿）。
  registry-consumer:
    name: registry consumer smoke (shadcn add + pattern dry-run + skills channel + typecheck defense + build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # pnpm 版本读根 package.json 的 packageManager 字段
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 冒烟脚本消费 registry/dist（静态 JSON 由本地 http server 托管给 shadcn add / dry-run）
      # 与 packages/core dist（typecheck 防线段 pnpm pack 打包已构建产物）
      - name: Build (core + registry)
        run: pnpm build

      - name: Consumer smoke (add + pattern dry-run + skills render + typecheck defense + build + assert)
        run: pnpm registry:smoke

  # M6-E：e2e 随 PR/push 跑（去掉 workflow_dispatch 门；顶层触发器保留可手动重跑）
  e2e:
    name: Playwright smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build core (demo 依赖 workspace dist)
        run: pnpm --filter @patterns-ui/core build
      - name: Install Playwright chromium
        run: pnpm --filter demo exec playwright install chromium --with-deps
      - name: Run smoke (webServer 自起 vite dev)
        run: pnpm --filter demo test:e2e
      # prod-preview 回归（renderer 冻结 bug 守卫，e2e/services-prod-preview.spec.ts）：
      # 构建一次复用，preview server 由 playwright webServer 自起（playwright.config.preview.ts）
      - name: Build demo (preview e2e 消费 dist)
        run: pnpm --filter demo build
      - name: Run prod-preview regression (webServer 自起 vite preview)
        run: pnpm --filter demo test:e2e:preview
      # M7-B2：三态截图基线校验（--check：不更新基线，diff 即败；diff 图随 trace artifact 上传）
      - name: Three-state screenshot baselines (--check)
        run: pnpm ui:shots --check
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-trace
          path: apps/demo/test-results/
          retention-days: 7

  # M6-E：fresh-clone 仿真——干净 checkout 后仅 pnpm install + pnpm dev 即起
  # （dev 的 core 源码 alias 见 apps/demo/vite.config.ts），随后 review 冒烟（build+preview+探活）。
  fresh-clone-dev:
    name: fresh clone dev + review smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 只 install + dev：不先 build core（验证干净 clone 的 dev 链路自足）
      - name: Dev smoke (pnpm dev → HTTP 200 on :5173)
        run: |
          pnpm dev > /tmp/dev.log 2>&1 &
          for i in $(seq 1 90); do
            curl -fsS http://localhost:5173/ > /dev/null && break
            sleep 1
          done
          if ! curl -fsS http://localhost:5173/ > /dev/null; then
            echo "::error::dev server did not come up on :5173"
            cat /tmp/dev.log
            exit 1
          fi
          echo "dev server up (200 on /)"
          pkill -f vite || true

      # review = vite build + vite preview（消费 core dist，故先 build core；preview 端口 4173 钉死于 vite 配置）
      - name: Build core (review 的 vite build 消费 workspace dist)
        run: pnpm --filter @patterns-ui/core build

      - name: Review smoke (pnpm review → HTTP 200 on :4173)
        run: |
          pnpm review > /tmp/review.log 2>&1 &
          for i in $(seq 1 150); do
            curl -fsS http://localhost:4173/ > /dev/null && break
            sleep 2
          done
          if ! curl -fsS http://localhost:4173/ > /dev/null; then
            echo "::error::preview server did not come up on :4173"
            cat /tmp/review.log
            exit 1
          fi
          echo "preview server up (200 on /)"
          pkill -f "vite preview" || true
