name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: lint / build / typecheck / test / registry validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # pnpm 版本读根 package.json 的 packageManager 字段
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint (biome)
        run: pnpm lint

      # 先构建：demo 的 typecheck 依赖 core dist 的 d.ts；registry:build 产出 registry.json 供 validate
      - name: Build (core + registry)
        run: pnpm build

      # 产物新鲜度：registry 构建输出必须与提交进仓库的版本一致（改源不改产物 = 红）
      - name: Registry freshness (registry.json / dist / theme css)
        run: git diff --exit-code -- registry.json registry/dist/r 'registry/themes/*.css'

      - name: Typecheck (all workspaces)
        run: pnpm -r typecheck

      - name: Unit & guard tests (core + demo)
        run: pnpm -r test

      # shadcn CLI 直拉法：CI 网络可直连 schema（本机 init/add 挂起是网络环境问题）
      - name: Validate shadcn registry
        run: pnpm dlx shadcn@latest registry validate

      - name: Build demo (vite)
        run: pnpm --filter demo build

  # ADR-0007：暂不 npm publish，但 publint/attw 保证 @patterns-ui/core 随时可发
  publint-attw:
    name: publint / attw (@patterns-ui/core)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # pnpm 版本读根 package.json 的 packageManager 字段
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build core (dual esm+cjs)
        run: pnpm --filter @patterns-ui/core build

      - name: publint
        run: pnpm --filter @patterns-ui/core exec publint

      # attw：npm 上的 "attw" 是防依赖混淆占位包，真身是 @arethetypeswrong/cli。
      # --profile node16 = 检查 node16 的 CJS 与 ESM 双向解析（bundler 免检）。
      # 排除 node10 列：该解析模式不认 exports map，子路径物理上无解（Node 10 亦不识别 .cjs，
      # 垫目录也救不了 require）——CJS 支持已诚实落地（双格式 + .d.cts 条件），非掩盖。
      - name: attw (pack & analyze)
        run: pnpm dlx @arethetypeswrong/cli -P packages/core --profile node16

  # 消费端冒烟：tmp vite+react19+ts 工程里 shadcn add 我们的 theme + status-badge → vite build → headless 令牌断言
  registry-consumer:
    name: registry consumer smoke (shadcn add → vite build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # pnpm 版本读根 package.json 的 packageManager 字段
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 冒烟脚本消费 registry/dist（静态 JSON 由本地 http server 托管给 shadcn add）
      - name: Build (core + registry)
        run: pnpm build

      - name: Consumer smoke (tmp vite app + shadcn add + build + assert)
        run: pnpm registry:smoke

  e2e:
    name: Playwright smoke (manual)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build core (demo 依赖 workspace dist)
        run: pnpm --filter @patterns-ui/core build
      - name: Install Playwright chromium
        run: pnpm --filter demo exec playwright install chromium --with-deps
      - name: Run smoke (webServer 自起 vite dev)
        run: pnpm --filter demo test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-trace
          path: apps/demo/test-results/
          retention-days: 7
